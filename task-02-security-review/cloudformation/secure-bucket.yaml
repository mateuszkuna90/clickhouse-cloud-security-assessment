AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Remediated version of the Task 2 assessment template. A private, KMS-encrypted,
  versioned and access-logged S3 bucket, plus a least-privilege IAM role for the
  workload that uses it. No IAM user and no long-term credentials.

# Notes
# - Intrinsic functions use the long form (Ref, Fn::Sub, Fn::GetAtt) instead of
#   the short "!Sub" tags, so the file is plain YAML that any parser can read.
# - Resource names are generated by CloudFormation (no hardcoded names), so the
#   stack only needs CAPABILITY_IAM, not CAPABILITY_NAMED_IAM.
# - Findings referenced below (CF-n) are described in ../README.md.

Parameters:
  WorkloadServicePrincipal:
    Type: String
    Description: >-
      AWS service that runs the workload and assumes the data-access role.
      The original template does not say what uses the bucket, so this is a
      parameter instead of a guess.
    AllowedValues:
      - ecs-tasks.amazonaws.com
      - lambda.amazonaws.com
      - ec2.amazonaws.com
    Default: ecs-tasks.amazonaws.com

  NoncurrentVersionRetentionDays:
    Type: Number
    Description: Days to keep previous (overwritten or deleted) object versions.
    Default: 90
    MinValue: 1
    MaxValue: 3650

  AccessLogRetentionDays:
    Type: Number
    Description: Days to keep S3 server access logs.
    Default: 365
    MinValue: 1
    MaxValue: 3650

Conditions:
  IsEcsWorkload:
    Fn::Equals:
      - Ref: WorkloadServicePrincipal
      - ecs-tasks.amazonaws.com
  IsEc2Workload:
    Fn::Equals:
      - Ref: WorkloadServicePrincipal
      - ec2.amazonaws.com

Resources:
  # ---------------------------------------------------------------------------
  # Encryption key (CF-6): customer managed, rotated, retained on stack delete.
  # ---------------------------------------------------------------------------
  DataBucketKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Customer managed key for the data bucket.
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # Standard AWS default key policy statement. It does not grant access
          # to anyone by itself; it lets IAM policies in this account control
          # access to the key. The workload role gets only Decrypt and
          # GenerateDataKey, via S3 (see DataBucketAccessPolicy).
          - Sid: EnableIamPolicies
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  # ---------------------------------------------------------------------------
  # Access log bucket (CF-9). Receives server access logs from DataBucket.
  # ---------------------------------------------------------------------------
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: This bucket is the access-log destination; logging it to itself would create a loop.
    Properties:
      # SSE-S3, not SSE-KMS: S3 server access log delivery supports only SSE-S3
      # on the destination bucket.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays:
              Ref: AccessLogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # Retained together with its bucket. Otherwise deleting the stack would keep
  # the bucket but remove its TLS-only and log-delivery restrictions.
  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket:
        Ref: AccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Log delivery is granted by bucket policy (ACLs are disabled by
          # BucketOwnerEnforced) and limited to logs from DataBucket in this
          # account, which prevents confused-deputy writes from other buckets.
          - Sid: AllowServerAccessLogDeliveryFromDataBucket
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource:
              Fn::Sub: "${AccessLogsBucket.Arn}/*"
            Condition:
              ArnLike:
                aws:SourceArn:
                  Fn::GetAtt: [DataBucket, Arn]
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - Fn::GetAtt: [AccessLogsBucket, Arn]
              - Fn::Sub: "${AccessLogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------------------
  # Data bucket: remediated "MyBucket" (CF-5 to CF-10).
  # ---------------------------------------------------------------------------
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID:
                Fn::GetAtt: [DataBucketKey, Arn]
            # Bucket Keys cut KMS requests and cost, but KMS CloudTrail events
            # are then per bucket key, not per object. Object-level auditing
            # comes from S3 access logs / CloudTrail data events (README A.2).
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName:
          Ref: AccessLogsBucket
        LogFilePrefix: data-bucket/
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays:
                Ref: NoncurrentVersionRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # Retained together with its bucket (see AccessLogsBucketPolicy).
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket:
        Ref: DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - Fn::GetAtt: [DataBucket, Arn]
              - Fn::Sub: "${DataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyTlsOlderThan12
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - Fn::GetAtt: [DataBucket, Arn]
              - Fn::Sub: "${DataBucket.Arn}/*"
            Condition:
              NumericLessThan:
                s3:TlsVersion: "1.2"
          # Objects uploaded without an encryption header get the bucket default
          # (SSE-KMS with DataBucketKey). This statement blocks a client from
          # explicitly asking for a different algorithm, such as SSE-S3. It
          # applies only when the header is present (Null = "false").
          - Sid: DenyNonKmsEncryptionHeader
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource:
              Fn::Sub: "${DataBucket.Arn}/*"
            Condition:
              "Null":
                s3:x-amz-server-side-encryption: "false"
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms

  # ---------------------------------------------------------------------------
  # Workload identity: replaces "MyIAMUser" (CF-1 to CF-4, CF-11).
  # A role is assumed by an AWS service and receives short-lived credentials.
  # ---------------------------------------------------------------------------
  WorkloadRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Workload role with access to the data bucket only.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowWorkloadServiceToAssume
            Effect: Allow
            Principal:
              Service:
                Ref: WorkloadServicePrincipal
            Action: sts:AssumeRole
            # ECS only: the role can be assumed only for ECS resources in this
            # account and region (confused-deputy protection, as recommended
            # in the ECS task IAM role documentation). Not added for Lambda and
            # EC2; for those, restrict who may attach the role with
            # iam:PassRole permissions.
            Condition:
              Fn::If:
                - IsEcsWorkload
                - ArnLike:
                    aws:SourceArn:
                      Fn::Sub: "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*"
                  StringEquals:
                    aws:SourceAccount:
                      Ref: AWS::AccountId
                - Ref: AWS::NoValue

  DataBucketAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Least-privilege access to the data bucket and its KMS key.
      Roles:
        - Ref: WorkloadRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListDataBucket
            Effect: Allow
            Action: s3:ListBucket
            Resource:
              Fn::GetAtt: [DataBucket, Arn]
          - Sid: ReadWriteDataBucketObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource:
              Fn::Sub: "${DataBucket.Arn}/*"
          - Sid: UseDataBucketKeyThroughS3Only
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource:
              Fn::GetAtt: [DataBucketKey, Arn]
            Condition:
              StringEquals:
                kms:ViaService:
                  Fn::Sub: "s3.${AWS::Region}.amazonaws.com"

  # Created only when the workload runs on EC2 (EC2 attaches roles through an
  # instance profile).
  WorkloadInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: IsEc2Workload
    Properties:
      Roles:
        - Ref: WorkloadRole

Outputs:
  DataBucketName:
    Description: Name of the data bucket.
    Value:
      Ref: DataBucket
  DataBucketArn:
    Description: ARN of the data bucket.
    Value:
      Fn::GetAtt: [DataBucket, Arn]
  AccessLogsBucketName:
    Description: Name of the access log bucket.
    Value:
      Ref: AccessLogsBucket
  DataBucketKeyArn:
    Description: ARN of the KMS key that encrypts the data bucket.
    Value:
      Fn::GetAtt: [DataBucketKey, Arn]
  WorkloadRoleArn:
    Description: ARN of the workload role.
    Value:
      Fn::GetAtt: [WorkloadRole, Arn]
  WorkloadInstanceProfileArn:
    Condition: IsEc2Workload
    Description: ARN of the instance profile (EC2 workloads only).
    Value:
      Fn::GetAtt: [WorkloadInstanceProfile, Arn]
